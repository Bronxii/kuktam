<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Kuktám családi meghívó</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #222222; background: #FAF5EE; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 560px; padding: clamp(24px, 6vw, 48px); background: #ffffff; border: 1px solid #e3e8df; border-radius: 24px; }
    .brand { margin: 0 0 32px; color: #2E7D32; font-size: 1.5rem; font-weight: 750; letter-spacing: -0.03em; }
    h1 { margin: 0 0 24px; font-size: clamp(1.75rem, 6vw, 2.25rem); line-height: 1.2; letter-spacing: -0.03em; }
    p { margin: 0 0 20px; font-size: 1rem; line-height: 1.65; }
    .lead { font-size: 1.125rem; font-weight: 600; }
    .guidance { margin-bottom: 0; padding: 20px; background: #FAF5EE; border-radius: 16px; color: #454b43; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Kuktám</p>
    <h1>Kuktám családi meghívó</h1>
    <p class="lead">Meghívót kaptál egy Kuktám családhoz.</p>
    <p>A meghívó elfogadásához nyisd meg ezt a linket azon az Android-eszközön, amelyen a Kuktám alkalmazás telepítve van.</p>
    <p class="guidance">Ha az alkalmazás még nincs telepítve, telepítsd a Kuktámot, majd nyisd meg újra a meghívólinket.</p>
  </main>
</body>
</html>
